name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days of low activity, which would silently
# kill the leaderboard. A weekly read is enough to count as activity.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then
            echo "No Supabase project configured yet — nothing to keep awake."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/squads?select=id&limit=1")
          echo "Supabase responded $code"
          # 401/403 still prove the project is awake; only a transport failure is fatal.
          [ "$code" != "000" ] || exit 1
