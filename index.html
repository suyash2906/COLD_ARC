<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values,
         otherwise the notch and home indicator overlap the UI in standalone mode. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Cold Arc</title>
    <meta name="description" content="Lock in. Track your winter arc." />

    <!-- iOS standalone-mode chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cold Arc" />
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
